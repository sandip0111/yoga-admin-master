<app-spinner *ngIf="isLoading"></app-spinner>

<div class="min-h-screen bg-slate-50 p-4 md:p-6">
  <div class="w-full max-w-full space-y-6">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <div class="w-12 h-12 rounded-2xl flex items-center justify-center border flex-shrink-0" style="background: #fff7ed; border-color: #ffedd5;">
          <i class="bi bi-pen-fill text-xl" style="color: #f47019;"></i>
        </div>
        <div class="flex flex-col justify-center">
          <div class="flex items-center gap-2">
            <h4 class="text-xl font-bold text-slate-800 leading-tight mb-0">{{ blogId ? 'Edit Blog Post' : 'Create Blog Post' }}</h4>
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold"
              [ngClass]="blogId ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'">
              {{ blogId ? 'Draft Mode' : 'New Post' }}
            </span>
          </div>
          <span class="text-xs text-slate-500 mt-0.5">Write engaging articles, set authors, upload featured cover images, and optimize SEO metadata</span>
        </div>
      </div>
      <button type="button" routerLink="/view-blog"
        class="inline-flex items-center justify-center gap-2 px-4 h-[42px] rounded-xl border border-slate-200 bg-white text-slate-700 text-sm font-semibold shadow-sm hover:bg-slate-50 hover:border-slate-300 transition-all duration-200 w-full sm:w-auto">
        <i class="bi bi-arrow-left" style="color: #f47019;"></i> Back to Blogs
      </button>
    </div>

    <!-- Main Grid Form -->
    <form #empForm="ngForm" enctype="multipart/form-data">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Main Content Area (Left 2 Columns) -->
        <div class="lg:col-span-2 space-y-6">
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 md:p-8 space-y-6">
            <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
              <i class="bi bi-file-earmark-text-fill text-base" style="color: #f47019;"></i>
              <h2 class="text-base font-bold text-slate-800">Article Content & Details</h2>
            </div>

            <!-- Blog Title -->
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                Blog Title <span class="text-red-500">*</span>
              </label>
              <div class="relative">
                <i class="bi bi-type-h1 absolute left-3.5 top-3 text-slate-400"></i>
                <input
                  type="text"
                  name="mentorsname"
                  placeholder="e.g. 10 Health Benefits of Kundalini Yoga Practice"
                  [(ngModel)]="formData.title"
                  required
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
                />
              </div>
            </div>

            <!-- Short Description -->
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                Short Description / Excerpt
              </label>
              <textarea
                name="shortDesc"
                rows="3"
                placeholder="Brief summary to hook readers on your feed..."
                [(ngModel)]="formData.shortDesc"
                class="w-full p-4 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50 resize-y"
              ></textarea>
            </div>

            <!-- Content Editor -->
            <div>
              <div class="flex items-center justify-between mb-2">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-0">
                  Body Content
                </label>
                <button type="button" (click)="toggleCode()"
                  class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-semibold border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition-all shadow-sm">
                  <i class="bi" [ngClass]="showCode ? 'bi-eye-fill text-orange-500' : 'bi-code-slash text-orange-500'"></i>
                  {{ showCode ? 'Switch to Visual Editor' : 'Edit HTML Source Code' }}
                </button>
              </div>

              <div class="rounded-xl overflow-hidden border border-slate-200">
                <quill-editor *ngIf="!showCode"
                  name="content"
                  [(ngModel)]="formData.content"
                  [style]="{height: '380px'}"
                  placeholder="Write engaging blog content here...">
                </quill-editor>
                <textarea *ngIf="showCode"
                  name="content_raw"
                  [(ngModel)]="formData.content"
                  rows="14"
                  class="w-full p-4 font-mono text-xs text-emerald-400 bg-slate-900 focus:outline-none resize-y min-h-[380px]"
                  placeholder="<h1 style='color:red'>TEST</h1>">
                </textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- Sidebar Settings Area (Right 1 Column) -->
        <div class="lg:col-span-1 space-y-6">
          
          <!-- Publish Settings Card -->
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 space-y-5">
            <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
              <i class="bi bi-gear-fill text-base" style="color: #f47019;"></i>
              <h2 class="text-base font-bold text-slate-800">Publish Settings</h2>
            </div>

            <!-- Blog Author -->
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                Select Author
              </label>
              <div class="relative">
                <i class="bi bi-person-badge absolute left-3.5 top-3 text-slate-400 z-10 pointer-events-none"></i>
                <select
                  name="authorId"
                  [(ngModel)]="formData.authorId"
                  class="w-full pl-10 pr-8 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50 appearance-none cursor-pointer"
                >
                  <option value="" disabled selected>Choose a mentor...</option>
                  <option *ngFor="let mentor of mentorList" [value]="mentor._id">{{ mentor.name }}</option>
                </select>
                <i class="bi bi-chevron-down absolute right-3.5 top-3 text-slate-400 pointer-events-none text-xs"></i>
              </div>
            </div>

            <!-- Blog Slug -->
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                URL Slug
              </label>
              <div class="relative">
                <i class="bi bi-link-45deg absolute left-3.5 top-3 text-slate-400"></i>
                <input
                  type="text"
                  name="slug"
                  placeholder="url-slug-format"
                  [(ngModel)]="formData.slug"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm font-mono text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
                />
              </div>
            </div>
          </div>

          <!-- Featured Image Card -->
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 space-y-4">
            <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
              <i class="bi bi-image-fill text-base" style="color: #f47019;"></i>
              <h2 class="text-base font-bold text-slate-800">Featured Image</h2>
            </div>

            <!-- Upload Widget / Preview -->
            <div *ngIf="formData.image" class="relative group rounded-xl overflow-hidden border border-slate-200">
              <img [src]="url + formData.image" alt="Featured Image Preview" class="w-full h-44 object-cover" />
              <div class="absolute inset-0 bg-slate-900/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                <button
                  type="button"
                  (click)="removeImage()"
                  class="px-3 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-md transition-all">
                  <i class="bi bi-trash3-fill"></i> Remove Cover
                </button>
              </div>
            </div>

            <div *ngIf="!formData.image">
              <label for="featured-image-upload" class="p-6 rounded-xl border-2 border-dashed border-slate-200 bg-slate-50/50 flex flex-col items-center justify-center gap-2 cursor-pointer hover:border-orange-300 hover:bg-orange-50/30 transition-all text-center">
                <div class="w-10 h-10 rounded-xl bg-orange-50 border border-orange-200 flex items-center justify-center text-orange-500">
                  <i class="bi bi-cloud-arrow-up text-xl"></i>
                </div>
                <span class="text-xs font-bold text-slate-700">Upload Cover Image</span>
                <span class="text-xs text-slate-400">PNG, JPG or WebP</span>
                <input
                  type="file"
                  id="featured-image-upload"
                  class="hidden"
                  (change)="selectBlogImage($event)"
                  accept="image/*"
                />
              </label>
            </div>
          </div>

          <!-- SEO Card -->
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 space-y-4">
            <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
              <i class="bi bi-search text-base" style="color: #f47019;"></i>
              <h2 class="text-base font-bold text-slate-800">SEO Settings</h2>
            </div>

            <!-- SEO Keywords -->
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                SEO Keywords
              </label>
              <div class="relative">
                <i class="bi bi-tags absolute left-3.5 top-3 text-slate-400"></i>
                <input
                  type="text"
                  name="seokeywords"
                  placeholder="yoga, fitness, wellness"
                  [(ngModel)]="formData.seokeywords"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
                />
              </div>
            </div>

            <!-- SEO Description -->
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                SEO Meta Description
              </label>
              <div class="relative">
                <i class="bi bi-card-text absolute left-3.5 top-3 text-slate-400"></i>
                <textarea
                  name="seodescription"
                  rows="3"
                  placeholder="Meta description for search engines..."
                  [(ngModel)]="formData.seodescription"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50 resize-y"
                ></textarea>
              </div>
            </div>
          </div>

        </div>

        <!-- Full-Width Bottom Action Footer -->
        <div class="lg:col-span-3 bg-white rounded-2xl shadow-sm border border-slate-100 p-6 flex flex-col sm:flex-row items-center justify-end gap-3">
          <button
            type="button"
            routerLink="/view-blog"
            class="w-full sm:w-auto px-6 py-3 rounded-xl border border-slate-200 text-slate-600 font-semibold text-sm hover:bg-slate-50 transition-all text-center">
            Cancel Changes
          </button>
          <button
            type="submit"
            (click)="createBlog(formData)"
            class="w-full sm:w-auto px-8 py-3 rounded-xl text-white text-sm font-bold shadow-md hover:shadow-lg transition-all duration-200 hover:-translate-y-0.5 flex items-center justify-center gap-2 me-3"
            style="background: linear-gradient(135deg, #f47019, #d95305);">
            <i class="bi bi-check-circle-fill"></i> Save Blog Post
          </button>
        </div>

      </div>
    </form>
  </div>
</div>
