<div class="min-h-screen bg-slate-50 p-4 md:p-6">
  <!-- Page Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <div class="flex items-center gap-3.5">
      <div class="w-12 h-12 rounded-2xl flex items-center justify-center border flex-shrink-0" style="background: #fff7ed; border-color: #ffedd5;">
        <i class="bi bi-file-earmark-text-fill text-xl" style="color: #f47019;"></i>
      </div>
      <div class="flex flex-col justify-center">
        <h4 class="text-xl font-bold text-slate-800 leading-tight mb-0">Update Page Content</h4>
        <span class="text-xs text-slate-500 mt-0.5">Manage static page body text, TinyMCE content, and SEO metadata</span>
      </div>
    </div>
  </div>

  <form #page="ngForm" class="space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- Left Column: Form & TinyMCE (7 cols) -->
      <div class="lg:col-span-7 space-y-6">
        <!-- Main Form Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 space-y-5">
          <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
            <i class="bi bi-pencil-square text-base" style="color: #f47019;"></i>
            <h2 class="text-base font-bold text-slate-800">Page Details</h2>
          </div>

          <!-- Select Page -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
              Select Page <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <i class="bi bi-layout-text-window-reverse absolute left-3.5 top-3 text-slate-400"></i>
              <select name="slug" [(ngModel)]="formData.slug"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50 appearance-none">
                <option value="undefined">Select Page</option>
                <option value="home">Home Page</option>
                <option value="about-us">About Page</option>
                <option value="terms-and-condtions">Terms &amp; Conditions Page</option>
                <option value="privacy-policy">Privacy Policy Page</option>
              </select>
              <i class="bi bi-chevron-down absolute right-3.5 top-3 text-slate-400 pointer-events-none"></i>
            </div>
          </div>

          <!-- Title -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
              Title <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <i class="bi bi-type-h1 absolute left-3.5 top-3 text-slate-400"></i>
              <input
                type="text"
                name="title"
                placeholder="Enter page title..."
                [(ngModel)]="formData.title"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
              />
            </div>
          </div>

          <!-- Page Text -->
          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-0">
                Page Content (Rich Text)
              </label>
              <button type="button" (click)="toggleCode()"
                class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-semibold border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition-all shadow-sm">
                <i class="bi" [ngClass]="showCode ? 'bi-eye-fill text-orange-500' : 'bi-code-slash text-orange-500'"></i>
                {{ showCode ? 'Switch to Visual Editor' : 'Edit HTML Source Code' }}
              </button>
            </div>
            <div class="rounded-xl overflow-hidden border border-slate-200">
              <quill-editor *ngIf="!showCode"
                name="editor1"
                [(ngModel)]="formData.text"
                [style]="{height: '340px'}"
                placeholder="Write page content here...">
              </quill-editor>
              <textarea *ngIf="showCode"
                name="editor1_raw"
                [(ngModel)]="formData.text"
                rows="12"
                class="w-full p-4 font-mono text-xs text-emerald-400 bg-slate-900 focus:outline-none resize-y min-h-[340px]"
                placeholder="<h1 style='color:red'>TEST</h1>">
              </textarea>
            </div>
          </div>
        </div>

        <!-- SEO Metadata Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 space-y-4">
          <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
            <i class="bi bi-search text-base" style="color: #f47019;"></i>
            <h2 class="text-base font-bold text-slate-800">SEO Metadata</h2>
          </div>

          <!-- SEO Title -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Page SEO Title</label>
            <input type="text" name="seotitle" [(ngModel)]="formData.seotitle" placeholder="Page SEO Title"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50" />
          </div>

          <!-- SEO Keywords -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Page SEO Keywords</label>
            <input type="text" name="seokeywords" [(ngModel)]="formData.seokeywords" placeholder="Page SEO Keywords"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50" />
          </div>

          <!-- SEO Description -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Page SEO Description</label>
            <input type="text" name="seodescription" [(ngModel)]="formData.seodescription" placeholder="Page SEO Description"
              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50" />
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            (click)="createPageData(formData)"
            class="w-full py-3 rounded-xl text-white text-sm font-bold shadow-md hover:shadow-lg transition-all duration-200 hover:-translate-y-0.5 flex items-center justify-center gap-2 mt-2"
            style="background: linear-gradient(135deg, #f47019, #d95305);">
            <i class="bi bi-check-circle-fill"></i> Update Page Content
          </button>
        </div>
      </div>

      <!-- Right Column: Pages List Table (5 cols) -->
      <div class="lg:col-span-5">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden sticky top-6">
          <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
            <h2 class="text-base font-bold text-slate-800">All Pages</h2>
            <span class="text-xs text-slate-400 font-medium">Total {{ pageData?.length || 0 }}</span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr style="background: linear-gradient(135deg, #fff7ed, #fff3e6);">
                  <th class="text-left px-5 py-3.5 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-100">Title</th>
                  <th class="text-center px-5 py-3.5 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-100">Status</th>
                  <th class="text-center px-5 py-3.5 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-100">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let page of pageData; let odd = odd"
                  class="border-b border-slate-50 hover:bg-orange-50/40 transition-colors duration-150"
                  [class.bg-slate-50/40]="odd">
                  <td class="px-5 py-4 font-semibold text-slate-800">
                    <div class="flex items-center gap-2">
                      <i class="bi bi-file-earmark-text text-orange-500"></i>
                      {{ page.title }}
                    </div>
                  </td>
                  <td class="px-5 py-4 text-center">
                    <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold"
                      [ngClass]="page.isActive ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700 border border-red-200'">
                      <i class="bi text-xs" [ngClass]="page.isActive ? 'bi-check-circle-fill' : 'bi-x-circle-fill'"></i>
                      {{ page.isActive ? 'Active' : 'Inactive' }}
                    </span>
                  </td>
                  <td class="px-5 py-4">
                    <div class="flex items-center justify-center gap-2">
                      <a routerLink="/pages/{{page._id}}"
                        class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold text-white transition-all hover:shadow-md hover:-translate-y-0.5"
                        style="background: linear-gradient(135deg, #f47019, #d95305);">
                        <i class="bi bi-pencil-square"></i> Edit
                      </a>
                      <button type="button" (click)="deletePage(page._id)"
                        class="inline-flex items-center justify-center w-8 h-8 rounded-lg border border-red-200 bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition-all hover:-translate-y-0.5"
                        title="Delete Page">
                        <i class="bi bi-trash3 text-xs"></i>
                      </button>
                    </div>
                  </td>
                </tr>
                <tr *ngIf="!pageData || pageData.length === 0">
                  <td colspan="3" class="text-center py-16">
                    <i class="bi bi-file-earmark-x text-slate-300 text-5xl block mb-3"></i>
                    <p class="text-slate-400 font-medium">No pages created yet.</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
