<div class="pranarambh-table-responsive">
  <table id="Swara_Sadhana" class="table table-bordered table-striped">
    <thead class="table-secondary">
      <th style="width: 10% !important">Sl No.</th>
      <th>Course</th>
      <th>Student Name</th>
      <th>Email</th>
      <th>Payment Status</th>
      <th>Payment Type</th>
      <th>Month</th>
      <th>Payment Date</th>
    </thead>
    <tbody>
      <tr
        *ngFor="
          let obj of list
            | paginate
              : {
                  itemsPerPage: 10,
                  currentPage: page,
                  totalItems: total
                };
          let i = index
        "
      >
        <td>{{ i + 1 + (page - 1) * 10 }}</td>
        <td>{{ obj.courseName }}</td>
        <td>
          {{ obj.name }}
        </td>
        <td>{{ obj.email }}</td>
        <td
          [ngClass]="{
            'text-warning':
              obj?.paymentStatus == 'pending' || obj?.paymentStatus == 'unpaid',
            'text-danger': obj?.paymentStatus == 'failed'
          }"
        >
          {{ obj.paymentStatus }}
        </td>
        <td>{{ obj.paymentType }}</td>
        <td>{{ obj.month }}</td>
        <td>
          <ng-container *ngIf="obj.created; else noPayment">
            {{ obj.created | date : "dd-MM-yyyy" }}
          </ng-container>
          <ng-template #noPayment>N/A</ng-template>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<div class="pagination">
  <pagination-controls
    (pageChange)="onsTableDataChange($event)"
  ></pagination-controls>
</div>
