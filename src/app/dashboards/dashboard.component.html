<div
  *ngIf="swaraLoading || fosLoading || liveClassLoading"
  class="loader-overlay"
>
  <div class="spinner-border text-primary" role="status">
    <span class="sr-only">Loading...</span>
  </div>
</div>
<div class="row">
  <div class="col-md-12 grid-margin stretch-card">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">Dashboard</h4>
        <ngb-tabset>
          <ngb-tab [title]="dashboardShared.pranaArambhTitle">
            <ng-template ngbTabContent>
              <app-prana-arambh
                (downloadCsv)="downloadCsv($event.csvContent, $event.tableId)"
                [paymentTypeOption]="paymentTypeOption"
              ></app-prana-arambh>
            </ng-template>
          </ngb-tab>
          <ngb-tab [title]="dashboardShared.breathDtoxTitle">
            <ng-template ngbTabContent>
              <app-breath-dtox
                (downloadCsv)="downloadCsv($event.csvContent, $event.tableId)"
              ></app-breath-dtox>
            </ng-template>
          </ngb-tab>
          <ngb-tab
            [title]="'Foundation of Spirituality  (' + foundationTotal + ')'"
          >
            <ng-template ngbTabContent>
              <div class="media">
                <div class="media-body">
                  <div class="header-container">
                    <h4>Foundation of Spirituality</h4>
                    <a
                      (click)="foundationExportToExcel('Foundation')"
                      class="export-link"
                      >Export to Excel</a
                    >
                  </div>
                  <div class="container_search">
                    <input
                      type="text"
                      placeholder="Search by Name or Email"
                      [(ngModel)]="foundationDetoxfilter.searchText"
                      class="search-input form-control"
                    />
                    <button
                      (click)="
                        getAllFoundationOfSpiritualityStudent(
                          foundationDetoxfilter
                        )
                      "
                    >
                      Search
                    </button>
                  </div>
                  <div class="table-responsive">
                    <table
                      id="Foundation"
                      class="table table-bordered table-striped"
                    >
                      <thead class="table-secondary">
                        <th style="inline-size: 4% !important">Sl No.</th>
                        <th>Student Name</th>
                        <th>Email</th>
                        <th>Is Active</th>
                      </thead>
                      <tbody>
                        <tr
                          *ngFor="
                            let spiritualityStdnt of spiritualityStudent
                              | paginate
                                : {
                                    itemsPerPage: 10,
                                    currentPage: foundationP,
                                    totalItems: foundationTotal
                                  };
                            let k = index
                          "
                        >
                          <td>{{ k + 1 + (foundationP - 1) * 10 }}</td>
                          <td>
                            {{ spiritualityStdnt.firstName }}
                            {{ spiritualityStdnt.lastName || "" }}
                          </td>
                          <td>{{ spiritualityStdnt.email }}</td>
                          <td>{{ spiritualityStdnt.isActive }}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <div class="pagination">
                    <pagination-controls
                      (pageChange)="onfoundationTableDataChange($event)"
                    ></pagination-controls>
                  </div>
                </div>
              </div>
            </ng-template>
          </ngb-tab>
          <ngb-tab [title]="dashboardShared.swarSadhnaTitle">
            <ng-template ngbTabContent>
              <app-swara-sadhana
                (downloadCsv)="downloadCsv($event.csvContent, $event.tableId)"
                [paymentOption]="paymentOption"
                [paymentTypeOption]="paymentTypeOption"
              ></app-swara-sadhana>
            </ng-template>
          </ngb-tab>
          <ngb-tab [title]="dashboardShared.freeWebinarTitle">
            <ng-template ngbTabContent>
              <app-free-webinner></app-free-webinner>
            </ng-template>
          </ngb-tab>
          <ngb-tab [title]="dashboardShared.pranicPurificationTitle">
            <ng-template ngbTabContent>
              <app-pranic-purification></app-pranic-purification>
            </ng-template>
          </ngb-tab>
          <ngb-tab [title]="dashboardShared.twoHunTTCTitle">
            <ng-template ngbTabContent>
              <app-two-hundred-online-ttc
                [paymentOption]="paymentOption"
                [paymentTypeOption]="paymentTypeOption"
              ></app-two-hundred-online-ttc>
            </ng-template>
          </ngb-tab>
          <ngb-tab [title]="dashboardShared.onlineClassTitle">
            <ng-template ngbTabContent>
              <app-online-live-class
                [paymentOption]="paymentOption"
                [paymentTypeOption]="paymentTypeOption"
                [customerGroups]="customerGroups"
                [monthOption]="monthOption"
              ></app-online-live-class>
            </ng-template>
          </ngb-tab>
          <ngb-tab [title]="dashboardShared.pendingPaymentTitle">
            <ng-template ngbTabContent>
              <app-pending-payment></app-pending-payment>
            </ng-template>
          </ngb-tab>
          <ngb-tab [title]="createSwaraSadhnaTitle">
            <ng-template ngbTabContent>
              <div class="container_search">
                <select
                  [(ngModel)]="selectedOption"
                  class="search-input form-control"
                >
                  <option [value]="0" selected hidden>Select a course</option>
                  <option *ngFor="let option of options" [value]="option.value">
                    {{ option.label }}
                  </option>
                </select>
                <input
                  type="text"
                  placeholder="Email"
                  [(ngModel)]="createSwaraSadhnaFrom.email"
                  class="search-input form-control"
                />
                <input
                  type="text"
                  placeholder="name"
                  [(ngModel)]="createSwaraSadhnaFrom.name"
                  class="search-input form-control"
                />
                <input
                  *ngIf="selectedOption == 1"
                  type="text"
                  placeholder="City"
                  [(ngModel)]="createSwaraSadhnaFrom.city"
                  class="search-input form-control"
                />
                <ng-container *ngIf="selectedOption == 4">
                  <label
                    class="line"
                    *ngFor="let option of onlineTeacherOption; let i = index"
                  >
                    <input
                      type="checkbox"
                      (change)="onCheckboxChange(option)"
                    />&nbsp;
                    <span>{{ option.title }}</span>
                  </label>
                </ng-container>
                <button
                  (click)="
                    registerSwarSadhanaWebinarUser(createSwaraSadhnaFrom)
                  "
                >
                  Register
                </button>
              </div>
            </ng-template>
          </ngb-tab>
        </ngb-tabset>
      </div>
    </div>
  </div>
</div>
