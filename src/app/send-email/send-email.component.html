<div class="form-container">
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Name</label>
      <input
        type="text"
        id="name"
        name="name"
        [(ngModel)]="name"
        required
        #nameInput="ngModel"
        class="form-control"
        placeholder="Enter your name"
      />
      <div *ngIf="nameInput.invalid && nameInput.touched" class="error-message">
        Name is required.
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        required
        #emailInput="ngModel"
        class="form-control"
        placeholder="Enter your email"
      />
      <div
        *ngIf="emailInput.invalid && emailInput.touched"
        class="error-message"
      >
        Email is required.
      </div>
    </div>

    <button type="submit" [disabled]="!name || !email" class="btn btn-primary">
      Send
    </button>
  </form>
</div>
