<app-spinner *ngIf="isLoading"></app-spinner>
<div class="page-header d-flex justify-content-between align-items-start mb-4">
  <div>
    <h3 class="page-title mb-2">Courses</h3>
    <h6 class="text-muted">Total {{total}} Courses(s)</h6>
  </div>
  <button type="button" class="btn btn-primary add-btn" routerLink="/addcourse">
    Add new course
  </button>
</div>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table custom-table mb-0">
        <thead>
          <tr>
            <th>TITLE</th>
            <th>LINK SLUG</th>
            <th>STATUS</th>
            <th class="text-center">ACTIONS</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of courseData | paginate: { itemsPerPage: 10, currentPage: p, totalItems: total }">
            <td class="course-title">
              <a href="javascript:void(0)">{{data.coursetitle}}</a>
            </td>
            <td class="slug-link">
              <a href="javascript:void(0)">{{data.slug}}</a>
            </td>
            <td>
              <span [ngClass]="data.isActive ? 'status-active' : 'status-inactive'">
                {{data.isActive ? 'Active' : 'InActive'}}
              </span>
            </td>
            <td class="text-center action-buttons">
              <button class="btn btn-primary btn-sm mx-1" routerLink="/addcourse/{{data._id}}">Edit</button>
              <button class="btn btn-primary btn-sm mx-1" routerLink="/content/{{data._id}}">Content</button>
              <button class="btn btn-primary btn-sm mx-1" routerLink="/fee/{{data._id}}">Fee</button>
              <button class="btn btn-primary btn-sm mx-1" routerLink="/upEvent/{{data._id}}">Upcoming Events</button>
              <button class="btn btn-info btn-sm mx-1 mt-1" *ngIf="data._id == '6a00ae5a73d17e5a08d3f6ce' || data._id == '6a00abfc9a6ce5ba990f5e6f'" routerLink="/course-video/{{data._id}}">
                Uploaded Videos
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="d-flex justify-content-center mt-4">
  <pagination-controls (pageChange)="onTableDataChange($event)"></pagination-controls>
</div>
