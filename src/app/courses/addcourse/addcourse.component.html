<div class="min-h-screen bg-slate-50 p-4 md:p-6">
  <div class="w-full max-w-full space-y-6">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <div class="w-12 h-12 rounded-2xl flex items-center justify-center border flex-shrink-0" style="background: #fff7ed; border-color: #ffedd5;">
          <i class="bi bi-journal-bookmark-fill text-xl" style="color: #f47019;"></i>
        </div>
        <div class="flex flex-col justify-center">
          <h4 class="text-xl font-bold text-slate-800 leading-tight mb-0">{{ courseId ? 'Edit Course' : 'New Course Information' }}</h4>
          <span class="text-xs text-slate-500 mt-0.5">Manage course content, fees, events, instructors, and SEO metadata</span>
        </div>
      </div>
      <button type="button" routerLink="/course"
        class="inline-flex items-center justify-center gap-2 px-4 h-[42px] rounded-xl border border-slate-200 bg-white text-slate-700 text-sm font-semibold shadow-sm hover:bg-slate-50 hover:border-slate-300 transition-all duration-200 w-full sm:w-auto">
        <i class="bi bi-arrow-left" style="color: #f47019;"></i> Show All Courses
      </button>
    </div>

    <!-- Main Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <form #course="ngForm" class="p-6 md:p-8 space-y-8">
        
        <!-- Section 1: Basic Information -->
        <div class="space-y-5">
          <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
            <i class="bi bi-info-circle-fill text-base" style="color: #f47019;"></i>
            <h2 class="text-base font-bold text-slate-800">Basic Course Details</h2>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Course Title -->
            <div class="md:col-span-1">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                Course Title <span class="text-red-500">*</span>
              </label>
              <div class="relative">
                <i class="bi bi-bookmark-title absolute left-3.5 top-3 text-slate-400"></i>
                <input
                  type="text"
                  name="coursetitle"
                  placeholder="e.g. 200 Hour Yoga Teacher Training"
                  [(ngModel)]="coursedetails.coursetitle"
                  required
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
                />
              </div>
            </div>

            <!-- Slug -->
            <div class="md:col-span-1">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                Link Slug
              </label>
              <div class="relative">
                <i class="bi bi-link-45deg absolute left-3.5 top-3 text-slate-400"></i>
                <input
                  type="text"
                  name="slug"
                  placeholder="course-url-slug"
                  [(ngModel)]="coursedetails.slug"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm font-mono text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
                />
              </div>
            </div>
          </div>

          <!-- Short Description -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
              Course Short Description <span class="text-slate-400 font-normal lowercase">(max 200 chars)</span>
            </label>
            <textarea
              name="shortDesc"
              rows="3"
              placeholder="Brief overview of the course shown in course cards..."
              [(ngModel)]="coursedetails.shortDesc"
              class="w-full p-4 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50 resize-y"
            ></textarea>
          </div>
        </div>

        <!-- Section 2: Rich Content Editors -->
        <div class="space-y-6">
          <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
            <i class="bi bi-file-earmark-rich-fill text-base" style="color: #f47019;"></i>
            <h2 class="text-base font-bold text-slate-800">Rich Course Content & Modules</h2>
          </div>

          <!-- Course Description -->
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-0">
                Full Course Description
              </label>
              <button type="button" (click)="toggleDescCode()"
                class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-semibold border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition-all shadow-sm">
                <i class="bi" [ngClass]="showDescCode ? 'bi-eye-fill text-orange-500' : 'bi-code-slash text-orange-500'"></i>
                {{ showDescCode ? 'Switch to Visual Editor' : 'Edit HTML Source Code' }}
              </button>
            </div>
            <div class="rounded-xl overflow-hidden border border-slate-200">
              <quill-editor *ngIf="!showDescCode" [(ngModel)]="coursedetails.courseDesc" name="courseDesc" [style]="{height: '260px'}"></quill-editor>
              <textarea *ngIf="showDescCode" name="courseDesc_raw" [(ngModel)]="coursedetails.courseDesc" rows="10" class="w-full p-4 font-mono text-xs text-emerald-400 bg-slate-900 focus:outline-none resize-y min-h-[260px]" placeholder="<h1 style='color:red'>TEST</h1>"></textarea>
            </div>
          </div>

          <!-- Course Subject Info -->
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-0">
                Course Subject &amp; Syllabus Info
              </label>
              <button type="button" (click)="toggleSubjectCode()"
                class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-semibold border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition-all shadow-sm">
                <i class="bi" [ngClass]="showSubjectCode ? 'bi-eye-fill text-orange-500' : 'bi-code-slash text-orange-500'"></i>
                {{ showSubjectCode ? 'Switch to Visual Editor' : 'Edit HTML Source Code' }}
              </button>
            </div>
            <div class="rounded-xl overflow-hidden border border-slate-200">
              <quill-editor *ngIf="!showSubjectCode" [(ngModel)]="coursedetails.subjectInfo" name="subjectInfo" [style]="{height: '260px'}"></quill-editor>
              <textarea *ngIf="showSubjectCode" name="subjectInfo_raw" [(ngModel)]="coursedetails.subjectInfo" rows="10" class="w-full p-4 font-mono text-xs text-emerald-400 bg-slate-900 focus:outline-none resize-y min-h-[260px]" placeholder="<h1 style='color:red'>TEST</h1>"></textarea>
            </div>
          </div>

          <!-- Includes & Excludes -->
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-0">
                Course Inclusions &amp; Exclusions
              </label>
              <button type="button" (click)="toggleIECode()"
                class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-semibold border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition-all shadow-sm">
                <i class="bi" [ngClass]="showIECode ? 'bi-eye-fill text-orange-500' : 'bi-code-slash text-orange-500'"></i>
                {{ showIECode ? 'Switch to Visual Editor' : 'Edit HTML Source Code' }}
              </button>
            </div>
            <div class="rounded-xl overflow-hidden border border-slate-200">
              <quill-editor *ngIf="!showIECode" [(ngModel)]="coursedetails.iAndEinfo" name="iAndEinfo" [style]="{height: '260px'}"></quill-editor>
              <textarea *ngIf="showIECode" name="iAndEinfo_raw" [(ngModel)]="coursedetails.iAndEinfo" rows="10" class="w-full p-4 font-mono text-xs text-emerald-400 bg-slate-900 focus:outline-none resize-y min-h-[260px]" placeholder="<h1 style='color:red'>TEST</h1>"></textarea>
            </div>
          </div>
        </div>

        <!-- Section 3: Media & Instructor -->
        <div class="space-y-5">
          <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
            <i class="bi bi-play-circle-fill text-base" style="color: #f47019;"></i>
            <h2 class="text-base font-bold text-slate-800">Media & Instructor Details</h2>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Intro Video ID -->
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                Course Intro Video ID
              </label>
              <div class="relative">
                <i class="bi bi-play-btn absolute left-3.5 top-3 text-slate-400"></i>
                <input
                  type="text"
                  name="courseintrovideoId"
                  placeholder="e.g. dQw4w9WgXcQ or Vimeo ID"
                  [(ngModel)]="coursedetails.courseintrovideoId"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
                />
              </div>
            </div>

            <!-- Course Mentor -->
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                Course Mentor / Instructor
              </label>
              <div class="relative">
                <i class="bi bi-person-badge absolute left-3.5 top-3 text-slate-400"></i>
                <input
                  type="text"
                  name="courseMentor"
                  placeholder="e.g. Prashant J Yoga"
                  [(ngModel)]="coursedetails.courseMentor"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
                />
              </div>
            </div>
          </div>

          <!-- Slider Image -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
              Course Slider Image
            </label>
            <div class="p-4 rounded-xl border-2 border-dashed border-slate-200 bg-slate-50/50 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-orange-50 border border-orange-200 flex items-center justify-center text-orange-500">
                  <i class="bi bi-image text-lg"></i>
                </div>
                <div>
                  <p class="text-xs font-semibold text-slate-700">Upload Featured Image</p>
                  <p class="text-xs text-slate-400">PNG, JPG or WebP up to 5MB</p>
                </div>
              </div>
              <input
                type="file"
                (change)="uploadMedia($event)"
                class="text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-orange-50 file:text-orange-600 hover:file:bg-orange-100 cursor-pointer"
              />
            </div>
          </div>
        </div>

        <!-- Section 4: SEO Metadata -->
        <div class="space-y-5">
          <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
            <i class="bi bi-search text-base" style="color: #f47019;"></i>
            <h2 class="text-base font-bold text-slate-800">Search Engine Optimization (SEO)</h2>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- SEO Title -->
            <div class="md:col-span-1">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                SEO Meta Title
              </label>
              <div class="relative">
                <i class="bi bi-search absolute left-3.5 top-3 text-slate-400"></i>
                <input
                  type="text"
                  name="metaTitle"
                  placeholder="Meta title for Google search..."
                  [(ngModel)]="coursedetails.metaTitle"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
                />
              </div>
            </div>

            <!-- SEO Keywords -->
            <div class="md:col-span-1">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                SEO Keywords
              </label>
              <div class="relative">
                <i class="bi bi-tags absolute left-3.5 top-3 text-slate-400"></i>
                <input
                  type="text"
                  name="metaKeyword"
                  placeholder="yoga, TTC, rishikesh, pranayama"
                  [(ngModel)]="coursedetails.metaKeyword"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
                />
              </div>
            </div>
          </div>

          <!-- SEO Description -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
              SEO Meta Description
            </label>
            <div class="relative">
              <i class="bi bi-card-text absolute left-3.5 top-3 text-slate-400"></i>
              <input
                type="text"
                name="metaDescription"
                placeholder="Detailed meta description for Google snippets..."
                [(ngModel)]="coursedetails.metaDescription"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
              />
            </div>
          </div>
        </div>

        <!-- Submit Button Section -->
        <div class="pt-6 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-end gap-3">
          <button
            type="button"
            routerLink="/course"
            class="w-full sm:w-auto px-5 py-3 rounded-xl border border-slate-200 text-slate-600 font-semibold text-sm hover:bg-slate-50 transition-all text-center">
            Cancel
          </button>
          <button
            type="submit"
            (click)="createCourse(coursedetails)"
            class="w-full sm:w-auto px-8 py-3 rounded-xl text-white text-sm font-bold shadow-md hover:shadow-lg transition-all duration-200 hover:-translate-y-0.5 flex items-center justify-center gap-2"
            style="background: linear-gradient(135deg, #f47019, #d95305);">
            <i class="bi bi-check-circle-fill"></i> Save Course Information
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
