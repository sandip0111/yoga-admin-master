<div class="min-h-screen bg-slate-50 p-4 md:p-6">
  <!-- Page Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <div class="flex items-center gap-3.5">
      <div class="w-12 h-12 rounded-2xl flex items-center justify-center border flex-shrink-0" style="background: #fff7ed; border-color: #ffedd5;">
        <i class="bi bi-chat-square-quote-fill text-xl" style="color: #f47019;"></i>
      </div>
      <div class="flex flex-col justify-center">
        <h4 class="text-xl font-bold text-slate-800 leading-tight mb-0">Testimonials</h4>
        <span class="text-xs text-slate-500 mt-0.5">Total <span class="font-semibold" style="color:#f47019">{{ testList?.length || 0 }}</span> Testimonial(s)</span>
      </div>
    </div>
  </div>

  <form #testimonial="ngForm">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- Left Column: Add New Testimonial Form (5 cols) -->
      <div class="lg:col-span-5">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 space-y-5">
          <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
            <i class="bi bi-plus-circle-fill text-base" style="color: #f47019;"></i>
            <h2 class="text-base font-bold text-slate-800">Add New Testimonial</h2>
          </div>

          <!-- Testimonial Quote -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
              Testimonial Quote <span class="text-red-500">*</span>
            </label>
            <textarea
              name="testimonial"
              rows="5"
              placeholder="Enter student testimonial quote..."
              [(ngModel)]="formData.testimonial"
              class="w-full p-4 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
            ></textarea>
          </div>

          <!-- Testimonial By (Author Name) -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
              Testimonial By <span class="text-xs text-slate-400 font-normal">(Enter Name)</span>
            </label>
            <div class="relative">
              <i class="bi bi-person absolute left-3.5 top-3 text-slate-400"></i>
              <input
                type="text"
                name="name"
                placeholder="Enter student name..."
                [(ngModel)]="formData.name"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
              />
            </div>
          </div>

          <!-- Upload Photo -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
              Upload Photo <span class="text-xs text-slate-400 font-normal">(Max size: 2MB)</span>
            </label>
            <label for="testimonial-photo-input" class="w-full flex items-center justify-between pl-3 pr-2 h-[42px] rounded-xl border border-slate-200 bg-slate-50/50 cursor-pointer hover:bg-slate-100/60 transition-all">
              <div class="flex items-center gap-2 text-sm text-slate-500 overflow-hidden pr-2">
                <i class="bi bi-cloud-arrow-up text-base flex-shrink-0" style="color: #f47019;"></i>
                <span class="truncate text-xs">Choose profile image...</span>
              </div>
              <span class="px-3 py-1 text-xs font-semibold text-white rounded-lg flex-shrink-0" style="background: linear-gradient(135deg, #f47019, #d95305);">
                Browse
              </span>
            </label>
            <input id="testimonial-photo-input" type="file" (change)="uploadImage($event)" accept="image/*" class="hidden" />
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            (click)="saveTestimonial(formData)"
            class="w-full py-3 rounded-xl text-white text-sm font-bold shadow-md hover:shadow-lg transition-all duration-200 hover:-translate-y-0.5 flex items-center justify-center gap-2"
            style="background: linear-gradient(135deg, #f47019, #d95305);">
            <i class="bi bi-check-circle-fill"></i> Save Testimonial
          </button>
        </div>
      </div>

      <!-- Right Column: Existing Testimonials Grid / List (7 cols) -->
      <div class="lg:col-span-7 space-y-2">
        <div class="flex items-center justify-between px-1">
          <h2 class="text-base font-bold text-slate-800">Testimonials List</h2>
          <span class="text-xs text-slate-400 font-medium">{{ testList?.length || 0 }} Item(s)</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div *ngFor="let test of testList; let i = index" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-col justify-between hover:border-orange-200 transition-all">
            <div class="space-y-3">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full overflow-hidden flex-shrink-0 border border-slate-200 shadow-sm bg-slate-100">
                  <img [src]="imageUrl + test.image" [alt]="test.name" class="w-full h-full object-cover" onerror="this.src='assets/images/user-placeholder.png'" />
                </div>
                <div>
                  <h3 class="font-bold text-slate-800 text-sm leading-tight">{{ test.name }}</h3>
                  <span class="text-xs text-orange-500 font-medium">Verified Student</span>
                </div>
              </div>
              <p class="text-slate-600 text-xs italic leading-relaxed line-clamp-4">
                "{{ test.testimonial }}"
              </p>
            </div>

            <div class="pt-4 mt-4 border-t border-slate-100 flex justify-end">
              <button
                type="button"
                (click)="deleteTestimonial(test._id)"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-50 text-red-600 border border-red-200 hover:bg-red-500 hover:text-white transition-all hover:-translate-y-0.5">
                <i class="bi bi-trash3"></i> Delete
              </button>
            </div>
          </div>
        </div>

        <div *ngIf="!testList || testList.length === 0" class="bg-white rounded-2xl shadow-sm border border-slate-100 text-center py-16">
          <i class="bi bi-chat-square-quote text-slate-300 text-5xl block mb-3"></i>
          <p class="text-slate-400 font-medium">No testimonials added yet.</p>
        </div>
      </div>
    </div>
  </form>
</div>
