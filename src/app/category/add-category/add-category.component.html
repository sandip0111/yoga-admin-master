<div class="min-h-screen bg-slate-50 p-4 md:p-6">
  <!-- Page Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <div class="flex items-center gap-3.5">
      <div class="w-12 h-12 rounded-2xl flex items-center justify-center border flex-shrink-0" style="background: #fff7ed; border-color: #ffedd5;">
        <i class="bi bi-folder-plus text-xl" style="color: #f47019;"></i>
      </div>
      <div class="flex flex-col justify-center">
        <h4 class="text-xl font-bold text-slate-800 leading-tight mb-0">Categories Management</h4>
        <span class="text-xs text-slate-500 mt-0.5">Create and manage course categories &amp; subcategories</span>
      </div>
    </div>
    <button type="button" routerLink="/subcategory"
      class="inline-flex items-center justify-center gap-2 px-4 h-[42px] rounded-xl text-white text-sm font-semibold shadow-sm hover:shadow-md transition-all duration-200 hover:-translate-y-0.5 w-full sm:w-auto"
      style="background: linear-gradient(135deg, #f47019, #d95305);">
      <i class="bi bi-diagram-3"></i> Manage Subcategories
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- Left Column: Add/Edit Category Form (5 cols) -->
    <div class="lg:col-span-5">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 space-y-5">
        <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
          <i class="bi bi-plus-circle-fill text-base" style="color: #f47019;"></i>
          <h2 class="text-base font-bold text-slate-800">Add New Category</h2>
        </div>

        <form class="space-y-4" #empForm="ngForm">
          <!-- Category Name -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
              Category Name <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <i class="bi bi-folder absolute left-3.5 top-3 text-slate-400"></i>
              <input
                type="text"
                name="categoryname"
                placeholder="e.g. Yoga Philosophy"
                [(ngModel)]="categoryDetails.categoryname"
                required
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
              />
            </div>
          </div>

          <!-- Slug -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
              Slug
            </label>
            <div class="relative">
              <i class="bi bi-link-45deg absolute left-3.5 top-3 text-slate-400"></i>
              <input
                type="text"
                name="slug"
                placeholder="e.g. yoga-philosophy"
                [(ngModel)]="categoryDetails.slug"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm font-mono text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
              />
            </div>
          </div>

          <!-- Meta Title -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
              Meta Title
            </label>
            <div class="relative">
              <i class="bi bi-search absolute left-3.5 top-3 text-slate-400"></i>
              <input
                type="text"
                name="metatitle"
                placeholder="Meta title for SEO"
                [(ngModel)]="categoryDetails.metatitle"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
              />
            </div>
          </div>

          <!-- Meta Description -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
              Meta Description
            </label>
            <div class="relative">
              <i class="bi bi-card-text absolute left-3.5 top-3 text-slate-400"></i>
              <input
                type="text"
                name="metadesc"
                placeholder="Meta description for SEO"
                [(ngModel)]="categoryDetails.metadescription"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
              />
            </div>
          </div>

          <!-- Meta Keyword -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
              Meta Keyword
            </label>
            <div class="relative">
              <i class="bi bi-tags absolute left-3.5 top-3 text-slate-400"></i>
              <input
                type="text"
                name="metakeyword"
                placeholder="Meta keywords"
                [(ngModel)]="categoryDetails.metakeyword"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
              />
            </div>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            (click)="createCategory(categoryDetails)"
            class="w-full py-3 rounded-xl text-white text-sm font-bold shadow-md hover:shadow-lg transition-all duration-200 hover:-translate-y-0.5 flex items-center justify-center gap-2"
            style="background: linear-gradient(135deg, #f47019, #d95305);">
            <i class="bi bi-check-circle-fill"></i> Submit Category
          </button>
        </form>
      </div>
    </div>

    <!-- Right Column: Category Table (7 cols) -->
    <div class="lg:col-span-7">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
          <h2 class="text-base font-bold text-slate-800">Existing Categories</h2>
          <span class="text-xs text-slate-400 font-medium">Total {{ categoryData?.length || 0 }}</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr style="background: linear-gradient(135deg, #fff7ed, #fff3e6);">
                <th class="text-left px-5 py-3.5 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-100">Category Name</th>
                <th class="text-center px-5 py-3.5 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-100">Status</th>
                <th class="text-center px-5 py-3.5 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-100">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let data of categoryData; let odd = odd"
                class="border-b border-slate-50 hover:bg-orange-50/40 transition-colors duration-150"
                [class.bg-slate-50/40]="odd">
                <td class="px-5 py-4">
                  <div class="flex items-center gap-2.5">
                    <i class="bi bi-folder2-open text-orange-500 text-base"></i>
                    <span class="font-semibold text-slate-800">{{ data.categoryname }}</span>
                  </div>
                </td>
                <td class="px-5 py-4 text-center">
                  <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold"
                    [ngClass]="data.isActive ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700 border border-red-200'">
                    <i class="bi text-xs" [ngClass]="data.isActive ? 'bi-check-circle-fill' : 'bi-x-circle-fill'"></i>
                    {{ data.isActive ? 'Active' : 'Inactive' }}
                  </span>
                </td>
                <td class="px-5 py-4">
                  <div class="flex items-center justify-center gap-2">
                    <button type="button" routerLink="/add-category/{{data._id}}"
                      class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold text-white transition-all hover:shadow-md hover:-translate-y-0.5"
                      style="background: linear-gradient(135deg, #f47019, #d95305);"
                      title="Edit Category">
                      <i class="bi bi-pencil-square"></i> Edit
                    </button>
                    <button type="button" (click)="deleteCategory(data._id)"
                      class="inline-flex items-center justify-center w-8 h-8 rounded-lg border border-red-200 bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition-all hover:-translate-y-0.5"
                      title="Delete Category">
                      <i class="bi bi-trash3 text-xs"></i>
                    </button>
                  </div>
                </td>
              </tr>
              <tr *ngIf="!categoryData || categoryData.length === 0">
                <td colspan="3" class="text-center py-16">
                  <i class="bi bi-folder-x text-slate-300 text-5xl block mb-3"></i>
                  <p class="text-slate-400 font-medium">No categories added yet.</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
