<div class="min-h-screen bg-slate-50 p-4 md:p-6">
  <!-- Page Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <div class="flex items-center gap-3.5">
      <div class="w-12 h-12 rounded-2xl flex items-center justify-center border flex-shrink-0" style="background: #fff7ed; border-color: #ffedd5;">
        <i class="bi bi-folder-fill text-xl" style="color: #f47019;"></i>
      </div>
      <div class="flex flex-col justify-center">
        <h4 class="text-xl font-bold text-slate-800 leading-tight mb-0">Categories</h4>
        <span class="text-xs text-slate-500 mt-0.5">Total <span class="font-semibold" style="color:#f47019">{{ categoryData?.length || 0 }}</span> Category(ies)</span>
      </div>
    </div>
    <button type="button" routerLink="/add-category"
      class="inline-flex items-center justify-center gap-2 px-4 h-[42px] rounded-xl text-white text-sm font-semibold shadow-sm hover:shadow-md transition-all duration-200 hover:-translate-y-0.5 w-full sm:w-auto"
      style="background: linear-gradient(135deg, #f47019, #d95305);">
      <i class="bi bi-plus-circle-fill"></i> Add Category
    </button>
  </div>

  <!-- Table Card -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr style="background: linear-gradient(135deg, #fff7ed, #fff3e6);">
            <th class="text-left px-5 py-3.5 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-100">Category Name</th>
            <th class="text-center px-5 py-3.5 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-100">Status</th>
            <th class="text-center px-5 py-3.5 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-100">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of categoryData; let odd = odd"
            class="border-b border-slate-50 hover:bg-orange-50/40 transition-colors duration-150"
            [class.bg-slate-50/40]="odd">
            <td class="px-5 py-4 font-semibold text-slate-800">
              <div class="flex items-center gap-2">
                <i class="bi bi-folder2-open text-orange-500"></i>
                {{ data.categoryname }}
              </div>
            </td>
            <td class="px-5 py-4 text-center">
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold"
                [ngClass]="data.isActive ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700 border border-red-200'">
                <i class="bi text-xs" [ngClass]="data.isActive ? 'bi-check-circle-fill' : 'bi-x-circle-fill'"></i>
                {{ data.isActive ? 'Active' : 'Inactive' }}
              </span>
            </td>
            <td class="px-5 py-4">
              <div class="flex flex-wrap gap-1.5 justify-center">
                <button class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold text-white transition-all hover:shadow-md hover:-translate-y-0.5"
                  style="background: linear-gradient(135deg, #f47019, #d95305);"
                  routerLink="/add-category/{{data._id}}">
                  <i class="bi bi-pencil-square"></i> Edit
                </button>
                <button class="inline-flex items-center justify-center w-8 h-8 rounded-lg border border-red-200 bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition-all hover:-translate-y-0.5"
                  (click)="deleteCategory(data._id)">
                  <i class="bi bi-trash3 text-xs"></i>
                </button>
                <button class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 transition-all"
                  routerLink="/subcategory/{{data._id}}">
                  <i class="bi bi-diagram-3"></i> SubCategory
                </button>
              </div>
            </td>
          </tr>
          <tr *ngIf="!categoryData || categoryData.length === 0">
            <td colspan="3" class="text-center py-16">
              <i class="bi bi-folder-x text-slate-300 text-5xl block mb-3"></i>
              <p class="text-slate-400 font-medium">No categories found.</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
