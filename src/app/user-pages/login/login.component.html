<app-spinner *ngIf="loading"></app-spinner>

<div class="login-page-container">
  <div class="glow-bg-orb glow-orb-1"></div>
  <div class="glow-bg-orb glow-orb-2"></div>

  <div class="login-card">
    <div class="brand-section">
      <div class="logo-wrapper">
        <img src="assets/images/logo2.png" alt="Yoga Vidya School" class="brand-logo">
      </div>
      <span class="portal-badge">ADMIN PORTAL</span>
    </div>

    <div class="form-header">
      <h2>Welcome Back 👋</h2>
      <p>Sign in to manage courses, students, and payments.</p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="doLogin(formData)" class="login-form">
      <div class="form-group mb-3 text-start">
        <label for="emailInput" class="form-label">Email Address</label>
        <div class="input-container">
          <i class="bi bi-envelope-fill field-icon"></i>
          <input
            id="emailInput"
            type="email"
            class="form-control field-input"
            name="email"
            [(ngModel)]="formData.email"
            placeholder="info@yogavidyaschool.com"
            required
            autocomplete="email"
          >
        </div>
      </div>

      <div class="form-group mb-3 text-start">
        <label for="passwordInput" class="form-label">Password</label>
        <div class="input-container">
          <i class="bi bi-shield-lock-fill field-icon"></i>
          <input
            id="passwordInput"
            [type]="showPassword ? 'text' : 'password'"
            class="form-control field-input"
            name="password"
            [(ngModel)]="formData.password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
          <button
            type="button"
            class="toggle-eye-btn"
            (click)="togglePasswordVisibility()"
            title="Toggle password visibility"
            tabindex="-1"
          >
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
          </button>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <label class="remember-me d-flex align-items-center">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" class="form-check-input me-2">
          <span>Remember me</span>
        </label>
      </div>

      <button type="submit" class="login-submit-btn" [disabled]="loading">
        <ng-container *ngIf="!loading">
          <span>Sign In to Dashboard</span>
          <i class="bi bi-arrow-right-circle-fill btn-arrow"></i>
        </ng-container>
        <ng-container *ngIf="loading">
          <i class="spinner-border spinner-border-sm me-2"></i>
          <span>Signing In...</span>
        </ng-container>
      </button>
    </form>

    <div class="card-footer-info">
      <div class="security-badge">
        <i class="bi bi-shield-check me-1"></i> 256-Bit Encrypted Admin Session
      </div>
      <div class="copyright-text mt-2">
        &copy; Yoga Vidya School Admin Portal
      </div>
    </div>
  </div>
</div>
