<div class="min-h-screen bg-slate-50 p-4 md:p-6">
  <div class="w-full max-w-full space-y-6">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <div class="w-12 h-12 rounded-2xl flex items-center justify-center border flex-shrink-0" style="background: #fff7ed; border-color: #ffedd5;">
          <i class="bi bi-easel-fill text-xl" style="color: #f47019;"></i>
        </div>
        <div class="flex flex-col justify-center">
          <h4 class="text-xl font-bold text-slate-800 leading-tight mb-0">{{ sliderId ? 'Edit Image Slider' : 'Create Image Slider' }}</h4>
          <span class="text-xs text-slate-500 mt-0.5">Configure slider banner title, subtitle, media asset, and SEO metadata</span>
        </div>
      </div>
      <button type="button" routerLink="/view-images"
        class="inline-flex items-center justify-center gap-2 px-4 h-[42px] rounded-xl border border-slate-200 bg-white text-slate-700 text-sm font-semibold shadow-sm hover:bg-slate-50 hover:border-slate-300 transition-all duration-200 w-full sm:w-auto">
        <i class="bi bi-arrow-left" style="color: #f47019;"></i> Show All Images
      </button>
    </div>

    <!-- Main Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <form #empForm="ngForm" class="p-6 md:p-8 space-y-8">
        
        <!-- Section 1: Slider Details -->
        <div class="space-y-5">
          <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
            <i class="bi bi-info-circle-fill text-base" style="color: #f47019;"></i>
            <h2 class="text-base font-bold text-slate-800">Slider Banner Details</h2>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Slider Title -->
            <div class="md:col-span-1">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                Slider Title <span class="text-red-500">*</span>
              </label>
              <div class="relative">
                <i class="bi bi-type-h1 absolute left-3.5 top-3 text-slate-400"></i>
                <input
                  type="text"
                  name="title"
                  placeholder="Enter Slider Title..."
                  [(ngModel)]="formData.title"
                  required
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
                />
              </div>
            </div>

            <!-- Slider Image File -->
            <div class="md:col-span-1">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                Slider Banner Image
              </label>

              <div *ngIf="!imageFetch && !formData.image" class="relative">
                <i class="bi bi-cloud-arrow-up absolute left-3.5 top-3 text-slate-400"></i>
                <label for="slider-image-input" class="w-full pl-10 pr-2 py-2 rounded-xl border border-slate-200 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-orange-400 transition-all bg-slate-50/50 flex items-center justify-between cursor-pointer hover:bg-slate-100/60 h-[42px]">
                  <span class="text-xs text-slate-400 truncate">Choose banner image file...</span>
                  <span class="px-3 py-1 rounded-lg text-xs font-semibold text-white shadow-sm flex-shrink-0" style="background: linear-gradient(135deg, #f47019, #d95305);">
                    Browse
                  </span>
                  <input
                    type="file"
                    id="slider-image-input"
                    name="fileimage"
                    (change)="selectSlider($event)"
                    accept="image/*"
                    class="hidden"
                  />
                </label>
              </div>

              <div *ngIf="imageFetch || formData.image" class="relative flex items-center">
                <div class="rounded-xl border border-slate-200 h-[42px] w-full flex items-center bg-slate-50/80 px-3 justify-between">
                  <div class="flex items-center gap-2 truncate">
                    <img [src]="url + (formData.image || imageFetch)" alt="Preview" class="w-7 h-7 rounded-lg object-cover border border-slate-200" />
                    <span class="text-xs font-mono text-slate-700 truncate max-w-[180px]">{{ formData.image || imageFetch }}</span>
                  </div>
                  <label for="slider-image-input-change" class="px-2.5 py-1 bg-orange-50 text-orange-600 hover:bg-orange-100 border border-orange-200 rounded-lg text-xs font-semibold cursor-pointer transition-all flex-shrink-0">
                    Change
                  </label>
                  <input
                    type="file"
                    id="slider-image-input-change"
                    name="fileimage"
                    (change)="selectSlider($event)"
                    accept="image/*"
                    class="hidden"
                  />
                </div>
              </div>
            </div>
          </div>

          <!-- Slider Paragraph -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
              Slider Paragraph / Subtitle
            </label>
            <textarea
              name="para"
              rows="4"
              placeholder="Enter paragraph text displayed on the slider banner..."
              [(ngModel)]="formData.para"
              class="w-full p-4 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50 resize-y"
            ></textarea>
          </div>
        </div>

        <!-- Section 2: SEO Settings -->
        <div class="space-y-5">
          <div class="flex items-center gap-2 pb-3 border-b border-slate-100">
            <i class="bi bi-search text-base" style="color: #f47019;"></i>
            <h2 class="text-base font-bold text-slate-800">SEO Settings</h2>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <!-- Meta Title -->
            <div class="md:col-span-1">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                Meta Title
              </label>
              <div class="relative">
                <i class="bi bi-search absolute left-3.5 top-3 text-slate-400"></i>
                <input
                  type="text"
                  name="metatitle"
                  placeholder="Meta title..."
                  [(ngModel)]="formData.metatitle"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
                />
              </div>
            </div>

            <!-- Meta Keyword -->
            <div class="md:col-span-1">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
                Meta Keyword
              </label>
              <div class="relative">
                <i class="bi bi-tags absolute left-3.5 top-3 text-slate-400"></i>
                <input
                  type="text"
                  name="metakeyword"
                  placeholder="Meta keyword..."
                  [(ngModel)]="formData.metakeyword"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
                />
              </div>
            </div>
          </div>

          <!-- Meta Description -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">
              Meta Description
            </label>
            <div class="relative">
              <i class="bi bi-card-text absolute left-3.5 top-3 text-slate-400"></i>
              <input
                type="text"
                name="metadesc"
                placeholder="Meta description..."
                [(ngModel)]="formData.metadesc"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent transition-all bg-slate-50/50"
              />
            </div>
          </div>
        </div>

        <!-- Action Footer -->
        <div class="pt-6 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-end gap-3">
          <button
            type="button"
            routerLink="/view-images"
            class="w-full sm:w-auto px-6 py-3 rounded-xl border border-slate-200 text-slate-600 font-semibold text-sm hover:bg-slate-50 transition-all text-center">
            Cancel
          </button>
          <button
            type="submit"
            (click)="createSlider(formData)"
            class="w-full sm:w-auto px-8 py-3 rounded-xl text-white text-sm font-bold shadow-md hover:shadow-lg transition-all duration-200 hover:-translate-y-0.5 flex items-center justify-center gap-2"
            style="background: linear-gradient(135deg, #f47019, #d95305);">
            <i class="bi bi-check-circle-fill"></i> Save Slider Information
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
